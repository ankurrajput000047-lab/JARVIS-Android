name: Build ULTRON APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ULTRON project
        run: |
          unzip -q ULTRON_V1_1_Android.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Fix Java 8 to Java 17
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/ULTRON_V1_1_Android/app/build.gradle.kts")
          s = p.read_text()

          s += """

          tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }
          """

          p.write_text(s)
          PY

      - name: Build ULTRON APK
        run: |
          cd project/ULTRON_V1_1_Android
          gradle assembleDebug

      - name: Upload ULTRON APK
        uses: actions/upload-artifact@v4
        with:
          name: ULTRON-debug-APK
          path: project/ULTRON_V1_1_Android/app/build/outputs/apk/debug/*.apk
